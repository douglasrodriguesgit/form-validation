<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">

  <title>Formulário</title>
</head>
<h1>Validação de formulário</h1>
<form id="form">

  <label for="name">Nome</label>
  <input type="text" id="name" name="name">
  <span class="errorName"></span>

  <label for="email">Email</label>
  <input type="email" id="email" name="email">
  <span class="errorEmail"></span>

  <label for="password">Senha</label>
  <input type="password" id="password" name="password">
  <span class="errorPassword"></span>

  <label for="job">Situação de trabalho</label>
  <select name="job" id="job">
    <option value=""> Você está buscando emprego?</option>
    <option value="yes">Sim</option>
    <option value="no">Não</option>
  </select>
  <span class="errorJob"></span>

  <label for="message">Mensagem:</label>
  <textarea name="message" id="message"></textarea>
  <span class="errorMessage"></span>

  <button type="submit">Enviar</button>
</form>

<h1 class="formvalidate2">Validação de formulário 2</h1>
<form id="form2">

<label for="nome">Nome</label>
<input type="nome" id="nome" name="nome" placeholder="Nome">  

<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Email">

</form>

<body>


  <script src="./js/script.js" defer></script>
</body>

</html>
